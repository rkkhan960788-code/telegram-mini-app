<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky Video</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0f1115;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 520px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin: 20px 0 5px;
    }

    .sub {
      text-align: center;
      color: #8b949e;
      margin-bottom: 25px;
    }

    .card {
      background: #191c23;
      padding: 16px;
      border-radius: 18px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 0;
      outline: 0;
      border-radius: 12px;
      background: #282d36;
      color: white;
      margin-bottom: 12px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #229ed9;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .video-box {
      display: none;
      margin-top: 20px;
    }

    video {
      width: 100%;
      border-radius: 15px;
      background: black;
    }

    .download {
      display: block;
      text-align: center;
      text-decoration: none;
      margin-top: 12px;
      padding: 14px;
      border-radius: 12px;
      background: #20c997;
      color: white;
      font-weight: bold;
    }

    .error {
      color: #ff6b6b;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Sky Video</h1>

  <div class="sub">
    Paste a direct video link
  </div>

  <div class="card">

    <input
      id="videoUrl"
      type="url"
      placeholder="https://example.com/video.mp4"
    >

    <button onclick="playVideo()">
      Play Video
    </button>

    <div id="error" class="error"></div>

    <div id="videoBox" class="video-box">

      <video id="player" controls playsinline></video>

      <a
        id="download"
        class="download"
        target="_blank"
        download
      >
        Download Video
      </a>

    </div>

  </div>

</div>

<script>

  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();

  function playVideo() {

    const url = document
      .getElementById("videoUrl")
      .value
      .trim();

    const error = document.getElementById("error");
    const videoBox = document.getElementById("videoBox");
    const player = document.getElementById("player");
    const download = document.getElementById("download");

    error.innerText = "";

    if (!url) {
      error.innerText = "Video URL paste karo.";
      return;
    }

    if (!url.startsWith("http://") &&
        !url.startsWith("https://")) {
      error.innerText = "Valid URL paste karo.";
      return;
    }

    player.src = url;

    download.href = url;

    videoBox.style.display = "block";

    player.load();

    player.play().catch(() => {
      // Browser autoplay ko block kar sakta hai.
      // User Play button daba sakta hai.
    });
  }

</script>

</body>
</html>
