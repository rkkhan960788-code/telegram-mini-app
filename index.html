<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Android Tools</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f5f5f5;
        padding: 25px 15px;
        color: #222;
    }

    .container {
        max-width: 500px;
        margin: auto;
    }

    h1 {
        text-align: center;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 25px;
    }

    .card {
        background: white;
        padding: 18px;
        margin-bottom: 15px;
        border-radius: 14px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h2 {
        font-size: 18px;
        margin-bottom: 12px;
    }

    button {
        width: 100%;
        padding: 14px;
        margin-top: 9px;
        border: none;
        border-radius: 10px;
        background: #222;
        color: white;
        font-size: 15px;
        cursor: pointer;
    }

    button:active {
        transform: scale(0.98);
    }

    .note {
        margin-top: 20px;
        padding: 12px;
        background: #fff3cd;
        border-radius: 10px;
        font-size: 13px;
        color: #664d03;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Android Tools</h1>
    <p class="subtitle">Open Android system settings</p>

    <div class="card">
        <h2>System</h2>

        <button onclick="openIntent('android.settings.SETTINGS')">
            Open Settings
        </button>

        <button onclick="openIntent('android.settings.WIFI_SETTINGS')">
            Wi-Fi Settings
        </button>

        <button onclick="openIntent('android.settings.BLUETOOTH_SETTINGS')">
            Bluetooth Settings
        </button>

        <button onclick="openIntent('android.settings.DISPLAY_SETTINGS')">
            Display Settings
        </button>

        <button onclick="openIntent('android.settings.SOUND_SETTINGS')">
            Sound Settings
        </button>
    </div>

    <div class="card">
        <h2>Device</h2>

        <button onclick="openIntent('android.settings.DATE_SETTINGS')">
            Date & Time
        </button>

        <button onclick="openIntent('android.settings.LOCATION_SOURCE_SETTINGS')">
            Location Settings
        </button>

        <button onclick="openIntent('android.settings.BATTERY_SAVER_SETTINGS')">
            Battery Settings
        </button>
    </div>

    <div class="note">
        Note: Chrome aur Android version ke according kuch intents
        block ya unsupported ho sakte hain.
    </div>

</div>

<script>
function openIntent(action) {

    const intent =
        "intent:#Intent;" +
        "action=" + action + ";" +
        "end";

    window.location.href = intent;
}
</script>

</body>
</html>
